services:
  # ---------------- MySQL Database ----------------
  mysql:
    image: mysql:8.4
    container_name: agri-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-agri_ecommerce}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- phpMyAdmin ----------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: agri-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 50M
    ports:
      - "8085:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agri-network

  # ---------------- Spring Boot Backend ----------------
  agri-backend:
    build:
      context: ./punyakoti-back
      dockerfile: Dockerfile
    container_name: agri-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - ./punyakoti-back/uploads:/app/uploads

  # ---------------- React/Vite Frontend ----------------
  agri-frontend:
    build:
      context: ./punyakoti-front
      dockerfile: Dockerfile
      args:
        # Bake in the API URL used by frontend. 
        # Nginx will proxy /api/v1 to http://agri-backend:8080/api/v1
        VITE_API_URL: /api/v1
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    container_name: agri-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      agri-backend:
        condition: service_healthy
    networks:
      - agri-network

volumes:
  mysql-data:

networks:
  agri-network:
    driver: bridge
